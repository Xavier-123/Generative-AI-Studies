model:
  path: E:/models/Qwen/Qwen2.5-0.5B-Instruct
  architecture: causal_lm
  use_lora: true
  gradient_checkpointing: true
  lora_rank: 8
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  path: data/sft/train.jsonl
  mode: sft
  max_length: 2048
  validation_ratio: 0.02
  system_prompt: You are a helpful assistant.
  add_system_prompt_if_missing: true
  num_workers: 0

training:
  algorithm: sft
  num_epochs: 3
  train_batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.1
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  logging_steps: 5
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
  precision: auto
  device: auto

runtime:
  seed: 42
  cuda_visible_devices: "0"

output_dir: output/sft
