model:
  path: E:/models/Qwen/Qwen2.5-0.5B-Instruct
  architecture: causal_lm
  use_lora: true

data:
  path: examples/dpo_example.jsonl
  mode: preference
  max_length: 2048
  validation_ratio: 0.2

training:
  algorithm: dpo
  num_epochs: 1
  train_batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.1
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  logging_steps: 5
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
  precision: auto
  device: auto

dpo:
  beta: 0.1
  label_smoothing: 0.0
  policy_path: output/final
  reference_path: output/final
  normalize_logp_by_length: false

runtime:
  seed: 42
  cuda_visible_devices: "0"

output_dir: output/dpo
